<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found | Kaya</title>
  <meta name="robots" content="noindex, nofollow" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0a;
      color: #f5f0eb;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .container {
      padding: 2rem;
      max-width: 560px;
    }

    .logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2rem;
      font-weight: 500;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #c9a96e;
      margin-bottom: 3rem;
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(5rem, 15vw, 8rem);
      font-weight: 400;
      color: #c9a96e;
      line-height: 1;
      margin-bottom: 0.5rem;
      opacity: 0.4;
    }

    h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.6rem;
      font-weight: 400;
      letter-spacing: 0.1em;
      margin-bottom: 1rem;
      color: #f5f0eb;
    }

    p {
      font-size: 0.9rem;
      color: #a09080;
      line-height: 1.7;
      margin-bottom: 2.5rem;
      font-weight: 300;
    }

    .btn {
      display: inline-block;
      padding: 0.85rem 2.5rem;
      border: 1px solid #c9a96e;
      color: #c9a96e;
      text-decoration: none;
      font-size: 0.8rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      transition: all 0.3s ease;
      font-family: 'Inter', sans-serif;
    }

    .btn:hover {
      background: #c9a96e;
      color: #0a0a0a;
    }

    .divider {
      width: 40px;
      height: 1px;
      background: #c9a96e;
      margin: 0 auto 2rem;
      opacity: 0.4;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">Kaya</div>
    <h1>404</h1>
    <div class="divider"></div>
    <h2>Page Not Found</h2>
    <p>The page you're looking for has moved or no longer exists.<br />Let us guide you back to our collection.</p>
    <a href="/" class="btn">Return Home</a>
  </div>
</body>
</html>
